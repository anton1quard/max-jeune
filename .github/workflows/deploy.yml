# Met à jour les données SNCF et publie le site sur GitHub Pages.
# - Lancé de l'extérieur par cron-job.org (appel API workflow_dispatch), car
#   les lancements programmés de GitHub sont trop irréguliers (souvent rien
#   avant midi). Secours : backup.yml. Pas de "schedule" ici exprès : GitHub
#   désactive après 60 jours sans commit les workflows programmés, et ce
#   workflow-ci doit toujours rester actif.
# - Aussi à chaque modification du code, ou à la main (onglet Actions >
#   "Mise à jour et déploiement" > Run workflow).
# - Hors modification du code, le site n'est republié que si les données SNCF
#   ont changé (ou si "forcer" est coché).
# - Si une étape échoue (données SNCF cassées, tests en échec), rien n'est
#   publié : le site reste sur la dernière version valide et GitHub t'envoie
#   un email.
name: Mise à jour et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Republier même si les données SNCF n'ont pas changé"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Tests du moteur Python
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Télécharger les données SNCF et préparer les fichiers du site
        run: python pipeline/build_data.py --out _site/data --download --csv /tmp/tgvmax.csv --gtfs /tmp/gtfs.zip

      - name: Les données ont-elles changé depuis la dernière publication ?
        id: changed
        env:
          FORCE: ${{ inputs.force }}
        run: >
          python pipeline/check_changed.py _site/data/meta.json
          "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/meta.json"
          >> "$GITHUB_OUTPUT"

      - name: Vérifier que le moteur web donne les mêmes résultats que le moteur Python
        if: steps.changed.outputs.deploy == 'true'
        run: |
          python web/tests/make_golden.py --out /tmp/golden.json --csv /tmp/tgvmax.csv --gtfs /tmp/gtfs.zip
          node web/tests/golden.test.mjs _site/data /tmp/golden.json

      - name: Assembler le site
        if: steps.changed.outputs.deploy == 'true'
        run: |
          cp -r web/index.html web/style.css web/app.js web/engine.js web/sw.js web/manifest.webmanifest web/icons _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/app.js _site/sw.js
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        if: steps.changed.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
